[project]
name = "cutlist-engine"
version = "0.1.0"
description = "CAD-to-cutlist MVP engine for extracting plywood boards and nesting sheet layouts."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "python-multipart>=0.0.6"
]

[project.optional-dependencies]
cad = ["ezdxf>=1.3.0"]
ai = ["groq>=0.9.0"]

[project.scripts]
cutlist-engine = "cutlist_engine.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
