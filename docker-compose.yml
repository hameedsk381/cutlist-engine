services:
  db:
    image: postgres:16-alpine
    container_name: cutlist-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cutlist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: cutlist
    volumes:
      - cutlist-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cutlist"]
      interval: 10s
      timeout: 5s
      retries: 5

  cutlist-engine:
    build: .
    image: cutlist-engine:latest
    container_name: cutlist-engine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-8000}:8000"
    environment:
      # Security — set CUTLIST_API_TOKEN to require Bearer auth on legacy /api/*
      CUTLIST_API_TOKEN: ${CUTLIST_API_TOKEN:-}
      # AI features (optional)
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CUTLIST_AI_MODEL: ${CUTLIST_AI_MODEL:-}
      CUTLIST_AI_VISION_MODEL: ${CUTLIST_AI_VISION_MODEL:-}
      CUTLIST_AI_SPEECH_MODEL: ${CUTLIST_AI_SPEECH_MODEL:-}
      CUTLIST_AI_DAILY_LIMIT: ${CUTLIST_AI_DAILY_LIMIT:-200}
      # Public safety: browser origins allowed to call the API (blank = any), sign-in rate limits
      CUTLIST_CORS_ORIGINS: ${CUTLIST_CORS_ORIGINS:-}
      CUTLIST_TRUST_PROXY: ${CUTLIST_TRUST_PROXY:-}
      CUTLIST_RATE_LIMIT: ${CUTLIST_RATE_LIMIT:-on}
      CUTLIST_CSP: ${CUTLIST_CSP:-}
      # SaaS database (users, projects, jobs)
      CUTLIST_DATABASE_URL: postgresql+psycopg://cutlist:${POSTGRES_PASSWORD}@db:5432/cutlist
      CUTLIST_JWT_SECRET: ${CUTLIST_JWT_SECRET:?set CUTLIST_JWT_SECRET in .env}
      CUTLIST_STORAGE_DIR: /data/storage
      # Free-plan quota
      CUTLIST_MONTHLY_JOB_LIMIT: ${CUTLIST_MONTHLY_JOB_LIMIT:-50}
      # Production limits
      CUTLIST_MAX_UPLOAD_MB: ${CUTLIST_MAX_UPLOAD_MB:-100}
      CUTLIST_MAX_TRIANGLES: ${CUTLIST_MAX_TRIANGLES:-500000}
      CUTLIST_SESSION_TTL_HOURS: ${CUTLIST_SESSION_TTL_HOURS:-168}
      # Sessions persist here across restarts
      CUTLIST_SESSION_DIR: /data/sessions
      # Keep at 1 (session state + locks live in-process)
      CUTLIST_WORKERS: ${CUTLIST_WORKERS:-1}
      # Email verification (M3)
      CUTLIST_SMTP_HOST: ${CUTLIST_SMTP_HOST:-}
      CUTLIST_SMTP_PORT: ${CUTLIST_SMTP_PORT:-587}
      CUTLIST_SMTP_USER: ${CUTLIST_SMTP_USER:-}
      CUTLIST_SMTP_PASSWORD: ${CUTLIST_SMTP_PASSWORD:-}
      CUTLIST_SMTP_FROM: ${CUTLIST_SMTP_FROM:-}
      CUTLIST_APP_URL: ${CUTLIST_APP_URL:-}
    volumes:
      - cutlist-sessions:/data/sessions
      - cutlist-storage:/data/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    mem_limit: 2g

  # Processes queued cutlist jobs from the DB — the API stays responsive
  saas-worker:
    build: .
    image: cutlist-engine:latest
    container_name: cutlist-worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "cutlist_engine.saas.worker"]
    environment:
      CUTLIST_DATABASE_URL: postgresql+psycopg://cutlist:${POSTGRES_PASSWORD}@db:5432/cutlist
      CUTLIST_STORAGE_DIR: /data/storage
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CUTLIST_AI_MODEL: ${CUTLIST_AI_MODEL:-}
      CUTLIST_AI_VISION_MODEL: ${CUTLIST_AI_VISION_MODEL:-}
      CUTLIST_AI_SPEECH_MODEL: ${CUTLIST_AI_SPEECH_MODEL:-}
      CUTLIST_MAX_TRIANGLES: ${CUTLIST_MAX_TRIANGLES:-500000}
      # Email (verification links etc.)
      CUTLIST_SMTP_HOST: ${CUTLIST_SMTP_HOST:-}
      CUTLIST_SMTP_PORT: ${CUTLIST_SMTP_PORT:-587}
      CUTLIST_SMTP_USER: ${CUTLIST_SMTP_USER:-}
      CUTLIST_SMTP_PASSWORD: ${CUTLIST_SMTP_PASSWORD:-}
      CUTLIST_SMTP_FROM: ${CUTLIST_SMTP_FROM:-}
      CUTLIST_APP_URL: ${CUTLIST_APP_URL:-}
    volumes:
      - cutlist-storage:/data/storage
    healthcheck:
      # The worker is a DB poller with no HTTP server — check the process, not a port.
      test: ["CMD-SHELL", "pgrep -f cutlist_engine.saas.worker || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 2g

volumes:
  cutlist-sessions:
  cutlist-storage:
  cutlist-db:
